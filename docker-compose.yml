services:
  kitchos-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev